            <p>An interactive 3D course in your browser. Turn on JavaScript to start.</p>
            <ol class="noscript-lessons"><li><b>Basics</b><ol><li><a href="/eletronica-101/closed-loop"><b>1. Open and closed circuits</b></a> — Electricity only flows round a complete loop: out of the battery’s +, through the bulb and back into its −.</li><li><a href="/eletronica-101/conductors"><b>2. Conductors &amp; insulators</b></a> — Some materials let current flow easily — conductors, like metals.</li><li><a href="/eletronica-101/ohms-law"><b>3. Volts, amps &amp; ohms</b></a> — Think of a wire as a pipe.</li><li><a href="/eletronica-101/circuit-types"><b>4. Types of circuit</b></a> — Open or closed, shorted, in series, in parallel or a mix: the same battery and bulbs behave very differently depending on how they are wired.</li><li><a href="/eletronica-101/cells"><b>5. Batteries: series &amp; parallel</b></a> — One AA cell gives 1.5 V.</li><li><a href="/eletronica-101/ac-dc"><b>6. AC and DC</b></a> — A battery gives direct current (DC): it always flows the same way.</li><li><a href="/eletronica-101/breadboard"><b>7. Using a breadboard</b></a> — A breadboard lets you build circuits without soldering.</li><li><a href="/eletronica-101/multimeter"><b>8. Using a multimeter</b></a> — A multimeter measures voltage, current and resistance, and checks continuity — but each test is set up differently: the dial picks what to measure, the red lead goes in the right socket, and the probes touch the right places.</li><li><a href="/eletronica-101/kirchhoff"><b>9. Kirchhoff’s two rules</b></a> — Two simple rules hold in every circuit.</li></ol></li><li><b>Resistors</b><ol><li><a href="/eletronica-101/resistor"><b>1. How a resistor works</b></a> — A resistor makes it harder for current to flow.</li><li><a href="/eletronica-101/colour-code"><b>2. Read the colour code</b></a> — Resistors are too small for printed numbers, so their value is painted on in coloured bands.</li><li><a href="/eletronica-101/series"><b>3. Resistors in series</b></a> — One after another, resistors make the current push through each of them in turn.</li><li><a href="/eletronica-101/parallel"><b>4. Resistors in parallel</b></a> — Side by side, resistors give the current more than one path.</li><li><a href="/eletronica-101/e12"><b>5. Standard values (E12)</b></a> — Work out the resistor a circuit needs and you may get 5 kΩ — a value you won’t find in a resistor kit.</li><li><a href="/eletronica-101/divider"><b>6. Voltage divider</b></a> — Two resistors in series share the supply’s voltage between them, in proportion to their resistance.</li><li><a href="/eletronica-101/pot"><b>7. Variable resistor</b></a> — A potentiometer is a resistor with a slider inside.</li><li><a href="/eletronica-101/pullup"><b>8. Pull-up and pull-down</b></a> — A button wired to an input only connects it while you press.</li><li><a href="/eletronica-101/power"><b>9. Power and heat</b></a> — Every resistor turns the energy flowing through it into heat.</li><li><a href="/eletronica-101/bridge"><b>10. Wheatstone bridge</b></a> — Two voltage dividers side by side, and a meter between their middles.</li></ol></li><li><b>LEDs &amp; diodes</b><ol><li><a href="/eletronica-101/led-polarity"><b>1. One way only</b></a> — An LED is a diode: it lets current through in one direction only.</li><li><a href="/eletronica-101/led-colours"><b>2. Colours and volts</b></a> — Each colour of LED needs a different voltage before it lights: red about 2 V, green a little more, blue and white about 3 V.</li><li><a href="/eletronica-101/led-burn"><b>3. Too much current</b></a> — An LED doesn’t know when to stop: past its forward voltage, the current shoots up.</li><li><a href="/eletronica-101/diode"><b>4. The plain diode</b></a> — A plain diode is an LED without the light: a one-way valve for current.</li><li><a href="/eletronica-101/zener"><b>5. Zener diode</b></a> — A zener diode is used the wrong way round, its band towards +.</li><li><a href="/eletronica-101/rectifier"><b>6. Bridge rectifier</b></a> — An AC supply pushes one way, then the other: its voltage swings to + and then to −, fifty times a second.</li><li><a href="/eletronica-101/led-series"><b>7. LEDs in series</b></a> — Two LEDs in a row share one current, but each needs its own voltage: about 2 V for a red one.</li><li><a href="/eletronica-101/rgb"><b>8. RGB colour mixing</b></a> — An RGB LED is three LEDs — red, green and blue — under one milky lens, sharing one leg to −.</li></ol></li><li><b>Capacitors</b><ol><li><a href="/eletronica-101/cap-tank"><b>1. Like a water tank</b></a> — Before the electronics, a picture with water.</li><li><a href="/eletronica-101/cap-charge"><b>2. Charge it up</b></a> — A capacitor is two metal plates with a thin insulator between them.</li><li><a href="/eletronica-101/cap-fade"><b>3. Fading light</b></a> — With the power on, the capacitor fills up right beside the LED.</li><li><a href="/eletronica-101/cap-flash"><b>4. Only while charging</b></a> — Put a capacitor in line with an LED and current flows only while the capacitor is filling: the LED flashes and goes out.</li><li><a href="/eletronica-101/cap-pair"><b>5. In series &amp; parallel</b></a> — Side by side — in parallel — two capacitors act like one bigger one: their capacitances add, so together they hold more and take longer to fill.</li><li><a href="/eletronica-101/cap-smooth"><b>6. Smoothing</b></a> — A diode lets an AC supply through one way only: what comes out is DC, but in bumps — on for half of each cycle, off for the other half.</li><li><a href="/eletronica-101/cap-delay"><b>7. Timed delay</b></a> — Like a stair light on a timer: press the button and the capacitor fills in an instant.</li><li><a href="/eletronica-101/cap-code"><b>8. Reading the code</b></a> — Small ceramic capacitors carry a three-digit code: two digits, then how many zeros follow, in picofarads.</li><li><a href="/eletronica-101/flasher"><b>9. Two flashing LEDs</b></a> — With two transistors and two capacitors, two LEDs take turns on their own for as long as the power is on.</li></ol></li><li><b>Switches &amp; buttons</b><ol><li><a href="/eletronica-101/push-button"><b>1. Push to light</b></a> — A push button joins two wires only while you hold it down.</li><li><a href="/eletronica-101/slide-switch"><b>2. Slide switch</b></a> — A slide switch stays where you put it.</li><li><a href="/eletronica-101/and-or"><b>3. AND &amp; OR</b></a> — Two switches in series must both be on for current to get through: that is AND.</li><li><a href="/eletronica-101/two-way"><b>4. Two-way switch</b></a> — A light on the stairs can be switched from the top and from the bottom.</li></ol></li><li><b>Transistors</b><ol><li><a href="/eletronica-101/transistor-control"><b>1. Current control</b></a> — A transistor has three legs: collector, base and emitter.</li><li><a href="/eletronica-101/transistor-switch"><b>2. A current switch</b></a> — Give the base more current than the LED could ever use and the transistor is simply on: a switch, worked by current.</li><li><a href="/eletronica-101/transistor-gain"><b>3. Current gain</b></a> — Between off and fully on, a transistor amplifies: the collector current is about 200 times the base current, so halving one halves the other.</li><li><a href="/eletronica-101/npn-pnp"><b>4. NPN and PNP</b></a> — Transistors come in two kinds.</li><li><a href="/eletronica-101/darlington"><b>5. Touch switch</b></a> — Your skin conducts, just badly: across a touch pad, a few microamps get through your finger.</li><li><a href="/eletronica-101/transistor-not"><b>6. Turn it round: NOT</b></a> — Put the transistor beside the LED instead of in line with it, and it works the other way round.</li></ol></li><li><b>Sensors</b><ol><li><a href="/eletronica-101/ldr-meter"><b>1. Light sensor</b></a> — A light-dependent resistor (LDR) is made of a material that conducts better the more light falls on it.</li><li><a href="/eletronica-101/night-light"><b>2. Night light</b></a> — Put the LDR at the bottom of a voltage divider and feed its middle to a transistor.</li><li><a href="/eletronica-101/thermistor"><b>3. Temperature sensor</b></a> — A thermistor is a resistor that changes with temperature.</li><li><a href="/eletronica-101/reed"><b>4. Reed switch</b></a> — A reed switch is two thin iron reeds sealed in a glass tube, almost touching.</li><li><a href="/eletronica-101/heat-alarm"><b>5. Heat alarm</b></a> — The night light’s circuit, with the sensor moved to the top of the divider: a thermistor above a 2.4 kΩ resistor.</li><li><a href="/eletronica-101/night-set"><b>6. Adjustable night light</b></a> — Real sensor circuits have a small adjustable resistor, a trimmer, to set exactly when they switch.</li><li><a href="/eletronica-101/hall"><b>7. Hall-effect sensor</b></a> — A Hall-effect sensor is a chip with a thin slice of semiconductor inside.</li></ol></li><li><b>Op-amps &amp; comparators</b><ol><li><a href="/eletronica-101/opamp-compare"><b>1. An op-amp compares</b></a> — An op-amp is a chip with two inputs, marked + and −, and one output.</li><li><a href="/eletronica-101/follower"><b>2. Voltage follower</b></a> — Wire an op-amp’s output straight back to its own − input and it pushes its output until its two inputs match, so its output simply copies, or follows, its + input.</li><li><a href="/eletronica-101/amplifier"><b>3. Amplifier with gain</b></a> — Feed back only part of the output, through two resistors, and the op-amp has to push its output higher to make its inputs match: it amplifies.</li><li><a href="/eletronica-101/comparator"><b>4. Comparator night light</b></a> — Back to comparing, now with a light sensor.</li><li><a href="/eletronica-101/schmitt"><b>5. Hysteresis (Schmitt trigger)</b></a> — At dusk the light changes slowly, and it never holds quite still: a cloud, a moving leaf.</li></ol></li><li><b>The 555 timer</b><ol><li><a href="/eletronica-101/monostable"><b>1. One-shot timer</b></a> — The 555 is a timer on a chip — one of the most used chips ever made.</li><li><a href="/eletronica-101/astable"><b>2. Flasher and duty cycle</b></a> — Wire the 555 so that it starts itself again every time, and it never stops: the LED flashes on its own.</li><li><a href="/eletronica-101/tone"><b>3. Tone generator</b></a> — Make the capacitor small and the 555 switches thousands of times a second: far too fast to see, but just right to hear.</li><li><a href="/eletronica-101/pwm"><b>4. PWM dimmer</b></a> — A resistor dims an LED by turning power into heat.</li></ol></li><li><b>Logic &amp; digital</b><ol><li><a href="/eletronica-101/gates"><b>1. Logic gates</b></a> — A logic gate is a tiny decision-maker on a chip.</li><li><a href="/eletronica-101/nand"><b>2. NAND builds everything</b></a> — A NAND gate is an AND gate with its answer turned round — the little circle on its symbol means NOT.</li><li><a href="/eletronica-101/logic-levels"><b>3. What counts as a 1</b></a> — So far a 1 has been the wire at +3 V and a 0 the wire at 0 V.</li><li><a href="/eletronica-101/latch"><b>4. A latch that remembers</b></a> — Gates can remember.</li><li><a href="/eletronica-101/counter"><b>5. Binary counter</b></a> — Press the button and the 74HC393 counts — in binary.</li><li><a href="/eletronica-101/display"><b>6. 7-segment display</b></a> — A 7-segment display is seven LEDs — bars named a to g — arranged as an 8, their negative legs joined.</li></ol></li></ol>
          </div>
        </noscript>

                <button type="button" role="tab" data-mode="board" aria-selected="false" data-i18n>Breadboard</button>
              </div>
              <button class="cd-close" type="button" aria-label="Close" title="Close (Esc)" data-i18n-attr="title aria-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
              </button>
            </header>
            <div class="cd-body"></div>
            <div class="cd-zoom" role="toolbar" aria-label="Zoom" data-i18n-attr="aria-label">
              <button type="button" data-zoom="xray" aria-pressed="false" title="See through the parts" aria-label="See through the parts" data-i18n-attr="title aria-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" /><circle cx="12" cy="12" r="2.8" /></svg>
              </button>
              <span class="cd-zoom-sep" aria-hidden="true"></span>
              <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out" data-i18n-attr="title aria-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in" data-i18n-attr="title aria-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
              <button type="button" data-zoom="fit" title="Show all of it" aria-label="Show all of it" data-i18n-attr="title aria-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
              </button>
            </div>
            <p class="cd-note"></p>
            <div class="cd-tip" hidden></div>
          </section>
        </div>

        <div class="viewbar" id="viewbar" role="toolbar" aria-label="3D view" data-i18n-attr="aria-label">
          <p class="view-hint" data-i18n>Drag or WASD to pan · Q / E to rotate · Scroll to zoom</p>
          <button data-view="left" title="Turn left (Q)" aria-label="Turn left" data-i18n-attr="title aria-label">
            <svg viewBox="0 0 24 24"><path d="M4.5 10.5A8 8 0 1 1 6 17" /><path d="M4 5v5.8h5.8" /></svg>
          </button>
          <button data-view="right" title="Turn right (E)" aria-label="Turn right" data-i18n-attr="title aria-label">
            <svg viewBox="0 0 24 24"><path d="M19.5 10.5A8 8 0 1 0 18 17" /><path d="M20 5v5.8h-5.8" /></svg>
          </button>
          <span class="viewbar-sep"></span>
          <button data-view="out" title="Zoom out (−)" aria-label="Zoom out" data-i18n-attr="title aria-label">
            <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
          </button>
          <button data-view="in" title="Zoom in (+)" aria-label="Zoom in" data-i18n-attr="title aria-label">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <span class="viewbar-sep"></span>
          <button data-view="reset" class="compass" title="Reset view (R)" aria-label="Reset view" data-i18n-attr="title aria-label">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><g class="compass-needle"><path d="M12 5.2 14.2 12h-4.4z" class="fill" /><path d="M12 18.8 9.8 12h4.4z" /></g></svg>
          </button>
          <button data-view="top" title="View from above (T)" aria-label="View from above" data-i18n-attr="title aria-label" aria-pressed="false">
            <svg viewBox="0 0 24 24"><rect x="4.5" y="7.5" width="15" height="12" rx="1.5" /><path d="M8.5 11.5h7M8.5 15.5h4" /><path d="M12 1.8v3.6M10.2 3.6 12 5.4l1.8-1.8" /></svg>
          </button>
        </div>
      </main>

      <!-- Top-right status -->
      <section class="status" aria-label="Progress" data-i18n-attr="aria-label">
        <div class="progress-card">
          <svg viewBox="0 0 40 40" class="progress-icon" aria-hidden="true"><path d="M20 10.6c-3.3-2.4-8.2-3.2-14-3v21.2c5.8-.2 10.7.6 14 3 3.3-2.4 8.2-3.2 14-3V7.6c-5.8-.2-10.7.6-14 3zM20 10.6v21.2" /><path d="M3 11v21c6.3-.5 12.6.2 17 2.6 4.4-2.4 10.7-3.1 17-2.6V11" /></svg>
          <div class="progress-body">
            <span class="progress-label" id="progress-label">Resistors</span>
            <div class="progress-row">
              <span class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><span class="progress-fill" id="progress-fill"></span></span>
              <span class="progress-count" id="progress-count">0/6</span>
            </div>
          </div>
        </div>
        <time class="clock" id="clock">
          <span id="clock-date">APR 24, 2025</span>
          <span id="clock-time">14:32:18</span>
        </time>
      </section>

      <!-- Right info panel -->
      <section class="info-card" aria-label="Lesson information" data-i18n-attr="aria-label">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="false" data-i18n>Overview</button>
          <button role="tab" aria-selected="false" data-i18n>Components</button>
          <button role="tab" aria-selected="true" class="is-active" data-i18n>Circuit</button>
          <button role="tab" aria-selected="false" data-i18n>Maths</button>
        </div>
        <div class="info-body" role="tabpanel">
          <div class="info-content"></div>
        </div>
      </section>

      <!-- Experiments: the tutorial picker, the steps and previous / next -->
      <section class="lessons" aria-label="Lessons" data-i18n-attr="aria-label">
        <div class="lesson-head">
          <button class="tutorial-pick" aria-haspopup="listbox" aria-expanded="false">
            <span class="tutorial-icon" aria-hidden="true"></span>
            <span class="tutorial-label"><span data-i18n>Lesson:</span> <span class="tutorial-name">Resistors</span></span>
            <svg class="tutorial-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9.5 6 6 6-6" /></svg>
          </button>
          <div class="tutorial-menu" role="listbox" aria-label="Lessons" data-i18n-attr="aria-label" hidden></div>
        </div>
        <div class="lesson-row">
          <div class="lesson-scroll">
            <ol class="lesson-list" id="lesson-list"></ol>
          </div>
          <div class="lesson-nav">
            <button class="lesson-prev" aria-label="Previous lesson" title="Previous lesson ([)" data-i18n-attr="aria-label title">
              <svg viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5" /></svg>
            </button>
            <button class="lesson-next" aria-label="Next lesson" title="Next lesson (])" data-i18n-attr="aria-label title">
              <svg viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5" /></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Footer (compact layout; the wide layout keeps these in the side nav) -->
      <footer class="app-foot">
        <a class="credit credit-row" href="https://academe.com.br" target="_blank" rel="noopener noreferrer" title="Academe Educação" data-i18n-attr="title">
          
          
          <span class="credit-text"><small data-i18n>Designed by</small><b>Academe Educação</b></span>
        </a>
      </footer>
    </div>
  </body>
</html>
